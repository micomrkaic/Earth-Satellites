<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Satellite Orbit Simulation</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000; font-family: monospace;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 8px;
    }
    #canvas-container { position: relative; width: 100%; max-width: 1200px; }
    /* The C side sizes the back-buffer to this element's physical pixel
       width (CSS px × devicePixelRatio) and then sets the CSS width/height
       inline via _fitCss(), so every device pixel maps 1:1 — no browser
       resampling in either direction.  width:100% is only the pre-init
       default; SDL detects the external CSS sizing and leaves it alone.  */
    canvas {
      display: block; width: 100%; height: auto;
      border: 1px solid #111;
    }
    #loading {
      position: absolute; inset: 0; background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }
    #loading-title { color: #4af; font-size: 15px; letter-spacing: 0.15em; }
    #progress-bar-outer { width: 260px; height: 8px; background: #111; border: 1px solid #2a4a2a; }
    #progress-bar-inner { height: 100%; width: 0%; background: #3d8; transition: width 0.15s ease; }
    #status { color: #567; font-size: 11px; }
    #hint { margin-top: 6px; font-size: 11px; color: #334; letter-spacing: 0.04em; text-align: center; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas" tabindex="0" width="1200" height="780"
            oncontextmenu="event.preventDefault()"></canvas>
    <div id="loading">
      <div id="loading-title">EARTH SATELLITE ORBIT SIMULATION</div>
      <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
      <div id="status">Initialising…</div>
    </div>
  </div>
  <div id="hint">
    1-8 satellites &middot; P map &middot; Space pause &middot; +/- speed &middot;
    J J2 &middot; C GPS &middot; F footprint &middot; R reset &middot;
    [ reset epoch &middot; ] +1 day &middot; H help &middot; click satellite for info &middot; drop .tle to import
  </div>

  <script>
    /* ── Disable resizable Wasm heap (emcc 6.0.2 GROWABLE_ARRAYBUFFERS=1) ──
       emcc 6.0.2's runtime does `try { wasmMemory.toResizableBuffer() }
       catch {}` and otherwise falls back to the classic fixed-length
       wasmMemory.buffer.  A resizable heap breaks TextDecoder.decode(),
       WebGL texSubImage2D, and other Web APIs that reject resizable views.
       Making the method throw forces the safe fallback regardless of the
       emcc version or build flags used.  (Also fixed via
       -sGROWABLE_ARRAYBUFFERS=0 in the Makefile; upstream reverted the
       default in 6.0.3.)                                                  */
    (function () {
      try {
        var P = WebAssembly.Memory.prototype;
        if ('toResizableBuffer' in P) {
          Object.defineProperty(P, 'toResizableBuffer', {
            value: function () { throw new TypeError('toResizableBuffer disabled'); },
            configurable: true, writable: true
          });
        }
      } catch (e) {}
    })();

    /* ── Key map: physical key code → SDL keycode ──────────────────────
       C polls window._wk each frame via EM_ASM_INT.  No C function call
       from JS required — eliminates all export/scope issues entirely.   */
    var KEY_MAP = {
      'Space':32,'Escape':27,'Equal':61,'Minus':45,
      'KeyQ':113,'KeyR':114,'KeyJ':106,'KeyG':103,
      'KeyH':104,'KeyP':112,'KeyC':99,'KeyF':102,'KeyV':118,
      'Digit1':49,'Digit2':50,'Digit3':51,'Digit4':52,
      'Digit5':53,'Digit6':54,'Digit7':55,'Digit8':56,
      'BracketLeft':91,'BracketRight':93   /* [ ] epoch skip */
    };

    /* Key queue (#3): FIFO array; C drains one per call via EM_ASM_INT.
       Capture phase fires regardless of DOM focus / iframe sandboxing.  */
    window._wkq = [];
    window.addEventListener('keydown', function(e) {
      var sym = KEY_MAP[e.code];
      if (sym !== undefined) {
        window._wkq.push(sym);
        e.preventDefault();
      }
    }, true);

    var canvas    = document.getElementById('canvas');
    var container = document.getElementById('canvas-container');

    /* ── Device-pixel sizing ──────────────────────────────────────────
       Measure the container in physical pixels; C reads window._devW at
       start-up (and polls it each frame) and sizes the back-buffer to it.
       It then calls _fitCss(W,H) with the exact buffer size so the CSS
       size is W/dpr — a 1:1 device-pixel mapping, hence crisp output at
       any zoom level or devicePixelRatio.                               */
    function measureDev() {
      var dpr = window.devicePixelRatio || 1;
      window._devW = Math.round(container.clientWidth * dpr);
    }
    measureDev();
    var _rt = null;
    window.addEventListener('resize', function() {
      clearTimeout(_rt);
      _rt = setTimeout(measureDev, 200);   /* debounce: rebuilds textures */
    });
    window._fitCss = function(W, H) {
      var dpr = window.devicePixelRatio || 1;
      var w = Math.min(container.clientWidth, W / dpr);
      canvas.style.width  = w + 'px';
      canvas.style.height = (w * H / W) + 'px';
    };

    /* Keep canvas focused for SDL2's own mouse/scroll handling          */
    canvas.addEventListener('mousedown', function() { canvas.focus(); });
    window.addEventListener('resize', function() { canvas.focus(); });

    /* Touch support (#4): single-finger drag → rotate; two-finger pinch → zoom.
       Deltas are accumulated in canvas-space pixels; C polls them via EM_ASM.  */
    window._tdx = 0; window._tdy = 0; window._tpinch = 0;
    var _lastTouch = null, _lastPinchDist = 0;

    canvas.addEventListener('touchstart', function(e) {
      e.preventDefault(); canvas.focus();
      if (e.touches.length === 1) {
        var r = canvas.getBoundingClientRect();
        var scale = 1200 / r.width;
        _lastTouch = { x: e.touches[0].clientX * scale,
                       y: e.touches[0].clientY * scale };
        _lastPinchDist = 0;
      } else if (e.touches.length === 2) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        _lastPinchDist = Math.sqrt(dx*dx + dy*dy);
        _lastTouch = null;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (e.touches.length === 1 && _lastTouch) {
        var r = canvas.getBoundingClientRect();
        var scale = 1200 / r.width;
        var cx = e.touches[0].clientX * scale;
        var cy = e.touches[0].clientY * scale;
        window._tdx += cx - _lastTouch.x;
        window._tdy += cy - _lastTouch.y;
        _lastTouch = { x: cx, y: cy };
      } else if (e.touches.length === 2) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (_lastPinchDist > 0) window._tpinch += dist - _lastPinchDist;
        _lastPinchDist = dist;
        _lastTouch = null;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', function(e) {
      e.preventDefault();
      if (e.touches.length === 0) { _lastTouch = null; _lastPinchDist = 0; }
    }, { passive: false });

    /* TLE drag-and-drop (#8): drop a .tle text file onto the canvas.
       Contents are stored in window._tleText; C polls and clears it.   */
    canvas.addEventListener('dragover', function(e) { e.preventDefault(); });
    canvas.addEventListener('drop', function(e) {
      e.preventDefault();
      var file = e.dataTransfer.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) { window._tleText = ev.target.result; };
      reader.readAsText(file);
    });

    var loadingDiv  = document.getElementById('loading');
    var progressBar = document.getElementById('progress-bar-inner');
    var statusEl    = document.getElementById('status');

    var Module = {
      canvas: canvas,
      setStatus: function(text) {
        if (!text) return;
        var m = text.match(/\((\d+)\/(\d+)\)/);
        if (m) {
          var pct = (parseInt(m[1]) / parseInt(m[2]) * 100).toFixed(0);
          progressBar.style.width = pct + '%';
          statusEl.textContent = 'Loading… ' + pct + '%';
        } else { statusEl.textContent = text; }
      },
      onRuntimeInitialized: function() {
        progressBar.style.width = '100%';
        statusEl.textContent = 'Ready';
        setTimeout(function() {
          loadingDiv.parentNode.removeChild(loadingDiv);
          canvas.focus();
        }, 500);
      },
      preRun: [], postRun: [],
      INITIAL_MEMORY: 67108864,
      print:    function(t) { console.log(t); },
      printErr: function(t) { console.warn(t); },
    };
  </script>

  {{{ SCRIPT }}}
</body>
</html>
